name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  contracts:
    name: Rust Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Check event docs are in sync with contract source
        run: python3 scripts/generate_events_doc.py --check

      - name: Verify every contract has an events.json entry
        run: |
          missing=0
          for dir in contracts/*/; do
            name=$(basename "$dir")
            if [ "$name" = "wasm-manifest.json" ]; then continue; fi
            if ! python3 -c "import json,sys; d=json.load(open('docs/events.json')); sys.exit(0 if '$name' in d else 1)"; then
              echo "::error::Contract '$name' has no entry in docs/events.json"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Add the missing contract(s) to docs/events.json and regenerate docs/events.md."
            exit 1
          fi

      - name: Reject literal persistent-entry TTLs
        run: |
          if rg -n 'let ttl_ledgers\s*=\s*[0-9]' contracts/token/src/lib.rs; then
            echo 'Use TokenContract::_ttl_ledgers(&env) for persistent-entry TTLs.'
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components:
            - rustfmt
            - clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run debug tests
        run: cargo test --workspace

      - name: Run release tests
        run: cargo test --workspace --release

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

      - name: Install Soroban CLI
        run: cargo install --locked soroban-cli

      - name: Build optimized WASM
        run: soroban contract build

      - name: Compute WASM hashes & validate manifest
        run: |
          MANIFEST="contracts/wasm-manifest.json"
          WASM_DIR="target/wasm32-unknown-unknown/release"
          PASS=true

          compute_hash() {
            sha256sum "$1" | cut -d' ' -f1
          }

          # Build a lookup of expected hashes from manifest
          echo "::group::WASM Hash Verification"
          for wasm in "$WASM_DIR"/*.wasm; do
            name=$(basename "$wasm" .wasm)
            # Crate names in manifest: soroban_token -> token, soroban_vesting -> vesting
            crate_name="${name//_token/}"
            crate_name="${crate_name//_vesting/}"
            # Map soroban-token -> token, soroban-vesting -> vesting
            manifest_key=""
            case "$name" in
              *airdrop*) manifest_key="airdrop" ;;
              *metadata*|*registry*) manifest_key="metadata_registry" ;;
              *token*) manifest_key="token" ;;
              *vesting*) manifest_key="vesting" ;;
              *factory*) manifest_key="factory" ;;
              *) manifest_key="$name" ;;
            esac

            actual_hash=$(compute_hash "$wasm")
            echo "WASM: $name ($manifest_key)"
            echo "  Hash: $actual_hash"

            # Get expected hash from manifest
            expected_hash=$(python3 -c "import json; m=json.load(open('$MANIFEST')); v=m.get('$manifest_key',{}).get('versions',{}); latest=v.get(m.get('$manifest_key',{}).get('latest',''),{}); print(latest.get('wasm_hash',''))" 2>/dev/null || echo "")

            if [ -n "$expected_hash" ]; then
              echo "  Expected: $expected_hash"
              if [ "$actual_hash" = "$expected_hash" ]; then
                echo "  ✅ Match"
              else
                echo "  ❌ Mismatch"
                PASS=false
              fi
            else
              echo "  ⚠️  No expected hash in manifest — add one manually"
            fi
          done
          echo "::endgroup::"

          if [ "$PASS" = "false" ]; then
            echo "WASM hashes do not match manifest. Did the contract code change?"
            echo "Run: sha256sum target/wasm32-unknown-unknown/release/*.wasm"
            echo "Then update contracts/wasm-manifest.json with the new hashes."
            exit 1
          fi

      - name: Report WASM Size & Hashes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const wasmDir = 'target/wasm32-unknown-unknown/release';
            
            if (!fs.existsSync(wasmDir)) {
              console.log('WASM target directory not found.');
              return;
            }

            const files = fs.readdirSync(wasmDir);
            const wasmFiles = files.filter(f => f.endsWith('.wasm'));
            
            let message = '### 📦 WASM Report\n\n| Contract | Size | SHA256 Hash |\n| :--- | ---: | :--- |\n';
            for (const file of wasmFiles) {
              const filePath = path.join(wasmDir, file);
              const stats = fs.statSync(filePath);
              const size = (stats.size / 1024).toFixed(2);
              const buf = fs.readFileSync(filePath);
              const hash = crypto.createHash('sha256').update(buf).digest('hex');
              message += `| \`${file}\` | ${size} KB | \`${hash}\` |\n`;
            }
            
            // Post result as PR comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('WASM Report')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message,
              });
            }


  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Run Jest tests
        run: npm run test

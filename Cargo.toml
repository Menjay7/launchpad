[workspace]
resolver = "2"
members = [
    "contracts/airdrop",
    "contracts/token",
    "contracts/vesting",
    "contracts/factory",
    "contracts/metadata-registry",
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true
